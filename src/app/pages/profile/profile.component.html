<div class="profile-container">
  <div class="profile-card">
    <!-- Avatar -->
    <div class="avatar">{{ userInitials }}</div>

    <!-- Profile Information -->
    <div class="profile-info">
<div class="info-group">
  <p><span>Username:</span> {{ user.username || 'N/A' }}</p>
  <p><span>Email:</span> {{ user.email || 'N/A' }}</p>
  <p><span>First Name:</span> {{ user.firstName || 'N/A' }}</p>
  <p><span>Last Name:</span> {{ user.lastName || 'N/A' }}</p>
  <p><span>Segment:</span> {{ user.segment }}</p>        <!-- ✅ Now a string -->
  <p><span>Plant:</span> {{ user.plant }}</p>            <!-- ✅ Now a string -->
</div>

    <div class="profile-actions">
      <button class="update-button" (click)="openUpdateForm()">Update</button>
     <button class="logout-button" (click)="logout()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 6px;">
    <path d="M17 7l-5 5 5 5V7zM19 3H9v2h10v14H9v2h10c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 2v14H6V5h12z"/>
  </svg>
  Logout
</button>
    </div>
  </div>
</div>

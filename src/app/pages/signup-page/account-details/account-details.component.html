<div>
    <h3 class="form-title">Your account details</h3>
    <form (ngSubmit)="onSubmit()" #accountForm="ngForm" class="account-form">
      <div class="row">
        <div class="form-group">
          <input matInput type="text" placeholder="Username" [(ngModel)]="accountDetails.username" name="username" required />
        </div>

        
        <div class="form-group">
            <mat-select [(ngModel)]="accountDetails.role"   name="role" required >
              <mat-option value="" disabled selected>Select role</mat-option> 
              <mat-option value="OPERATEUR">Operator</mat-option>
              <mat-option value="QM">Quality Manager</mat-option>
              <mat-option value="ADMIN">Administrator</mat-option>
            </mat-select>
        </div>
        
      </div>
  
      <div class="row">
        <div class="form-group">
          <input matInput type="password" placeholder="Password" [(ngModel)]="accountDetails.password" name="password" required />
        </div>
        <div class="form-group">
          <input matInput type="password" placeholder="Confirm Password" [(ngModel)]="accountDetails.confirmPassword" name="confirmPassword" required />
        </div>
      </div>
  
      <div class="buttons">
        <button mat-button type="button" (click)="Goback()" class="back-button" style="font-size: 30px;">⬅</button>
        <button mat-button type="submit" class="next-button">Next</button>
      </div>
    </form>
  </div>

<div>
  <h3 class="form-title">Your personal details</h3>
  <form (ngSubmit)="onSubmit()" #personalForm="ngForm">
    <div class="form-group">
      <input matInput type="text" placeholder="Matricule number" [(ngModel)]="personalDetails.matricule" name="matricule" required />
    </div>
    <div class="form-group">
      <input matInput type="text" placeholder="First Name" [(ngModel)]="personalDetails.firstName" name="firstName" required />
    </div>
    <div class="form-group">
      <input matInput type="text" placeholder="Last Name" [(ngModel)]="personalDetails.lastName" name="lastName" required />
    </div>
    <div class="form-group">
      <input matInput type="text" placeholder="National ID Number" [(ngModel)]="personalDetails.nid" name="nid" required />
    </div>
    <div class="form-group">
      <input matInput type="email" placeholder="Email Address" [(ngModel)]="personalDetails.email" name="email" required />
    </div>
    <div class="next-button-container">
    <button mat-button type="submit" class="next-button">Next</button>
    </div>
  </form>
</div>

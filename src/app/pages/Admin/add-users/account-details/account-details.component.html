<div>
  <h3 class="form-title">Account Details</h3>
  <form [formGroup]="accountForm" (ngSubmit)="onSubmit()" class="account-form">
    <div class="row">
      <div class="form-group">
        <mat-select formControlName="role" required>
          <mat-option value="" disabled>Select role</mat-option>
          <mat-option value="OPERATEUR">Operator</mat-option>
          <mat-option value="QM">Quality Manager</mat-option>
          <mat-option value="ADMIN">Administrator</mat-option>
        </mat-select>
      </div>
            <div class="form-group">
        <input
          matInput
          type="text"
          placeholder="Username / Number"
          formControlName="username"
          [readonly]="accountForm.get('role')?.value === 'ADMIN'"
          required
        />
      </div>
    </div>
    <!-- Matricule (for OPERATEUR and QM) -->
    <div class="row" *ngIf="accountForm.get('role')?.value === 'OPERATEUR' || accountForm.get('role')?.value === 'QM'">
      <div class="form-group">
        <input matInput type="text" placeholder="Matricule" formControlName="matricule" required />
      </div>
    </div>
    <!-- Email (for ADMIN) -->
    <div class="row" *ngIf="accountForm.get('role')?.value === 'ADMIN'">
      <div class="form-group">
        <input matInput type="email" placeholder="Email Address" formControlName="email" required />
      </div>
    </div>
    <!-- Factory Site (for QM and ADMIN) -->
    <div class="row" *ngIf="accountForm.get('role')?.value === 'QM' || accountForm.get('role')?.value === 'ADMIN'|| accountForm.get('role')?.value === 'OPERATEUR'">
      <div class="form-group">
        <mat-select formControlName="factorySite" required>
          <mat-option value="" disabled>Select Factory Site</mat-option>
          <mat-option value="LTN03">LTN03</mat-option>
          <mat-option value="LTN04">LTN04</mat-option>
        </mat-select>
      </div>
    </div>
    <!-- Password (auto-generated, read-only) -->
    <div class="row">
      <div class="form-group">
        <input matInput type="text" placeholder="Password" formControlName="password" readonly />
      </div>
    </div>
    <!-- File Upload -->
    <label class="custom-file-upload">
      <input type="file" (change)="onFileSelected($event)" accept=".xlsx,.xls" />
      📁 {{ fileName }}
    </label>
    <!-- Submit Button -->
    <div class="buttons">
      <button mat-button type="submit" class="next-button">Next</button>
    </div>
  </form>
</div>

<div class="delete-section-bg">
  <div class="delete-user-container">
    <h2 class="delete-title-left">Delete User</h2>
    <form (ngSubmit)="deleteUser()" class="delete-form">
      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Select Role</mat-label>
          <mat-select [(ngModel)]="role" name="role" required>
            <mat-option value="ADMIN">Admin</mat-option>
            <mat-option value="OPERATEUR">Operateur</mat-option>
            <mat-option value="QM">Quality Manager</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Identifier (Matricule or Email)</mat-label>
          <input
            matInput
            [(ngModel)]="matricule"
            name="matricule"
            required
            placeholder="Enter identifier"
          />
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-button type="submit" class="delete-btn">Delete</button>
      </div>
    </form>
  </div>
</div>

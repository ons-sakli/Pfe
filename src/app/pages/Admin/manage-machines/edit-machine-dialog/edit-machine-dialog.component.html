<h2 mat-dialog-title>Edit Machine {{ updatedMachine.nrMachine }}</h2>

<form [formGroup]="machineForm" (ngSubmit)="onSave()">
  <mat-dialog-content class="dialog-content">
    <!-- Type -->
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Type</mat-label>
      <input
        matInput
        formControlName="type"
        [matAutocomplete]="autoType"
        placeholder="Enter or select a type"
        required
      />
      <mat-autocomplete #autoType="matAutocomplete">
        <mat-option *ngFor="let type of machineTypes" [value]="type">
          {{ type }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <!-- Client -->
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Client</mat-label>
      <input
        matInput
        formControlName="client"
        [matAutocomplete]="autoClient"
        placeholder="Enter or select a client"
        required
      />
      <mat-autocomplete #autoClient="matAutocomplete">
        <mat-option *ngFor="let client of clients" [value]="client">
          {{ client }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <!-- Plant Site Name -->
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Plant Site Name</mat-label>
      <input
        matInput
        formControlName="plantSiteName"
        [matAutocomplete]="autoPlant"
        placeholder="Enter or select a plant site"
        required
      />
      <mat-autocomplete #autoPlant="matAutocomplete">
        <mat-option *ngFor="let site of plantSiteNames" [value]="site">
          {{ site }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <!-- Segment -->
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Segment</mat-label>
      <input
        matInput
        formControlName="segmentName"
        [matAutocomplete]="autoSegment"
        placeholder="Enter or select a segment"
        required
      />
      <mat-autocomplete #autoSegment="matAutocomplete">
<mat-option *ngFor="let s of segments" [value]="s.segmentName">
  {{ s.segmentName }} ({{ s.plantSiteName }})
</mat-option>
      </mat-autocomplete>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save</button>
  </mat-dialog-actions>
</form>

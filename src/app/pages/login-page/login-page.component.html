<div class="login-container">
    <div class="left-section">
      <img src="téléchargement (1).jpeg" alt="LEONI Logo" class="logo" />
      <img src="img1.jpg" alt="Lamp Image" class="lamp-image" />
    </div>
    <div class="right-section">
      <h2 class="login-title">LOG IN</h2>

      <form class="login-form" (ngSubmit)="onLogin()">
        <input type="text"  name="username" placeholder="UserName" class="input-field" required />
        <!-- Updated input field for identifier -->
      <input
        type="text"
        [(ngModel)]="identifier"
        name="identifier"
        placeholder="Enter your Mat or email"
        class="input-field"
        required
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        class="input-field"
        required
      />

      <a href="#" class="forgot-password">Forgot Password ?</a>
        
        <button type="submit" class="login-button">Submit</button>
      </form>
    </div>
  </div>
